[project]
name = "mcp-tool-guardian"
version = "1.0.0"
description = "MCP server for validating, sanitizing and scoring AI tool outputs – built for agent reliability and accountability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prince Ruhul", email = "princeruhulofficial@gmail.com" }
]
keywords = ["mcp", "ai-agent", "reliability", "validation", "accountability"]
dependencies = [
    "mcp>=1.0.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-tool-guardian = "src.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
